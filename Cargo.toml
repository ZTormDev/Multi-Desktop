[package]
name = "multi-desktop"
version = "0.1.0"
edition = "2024"
description = "A self-hosted, isolated multi-desktop control plane for Linux"
license = "MIT"

[[bin]]
name = "multidesktopd"
path = "src/main.rs"

[[bin]]
name = "multi-desktop-session"
path = "src/bin/desktop_session.rs"

[[bin]]
name = "multi-desktop-capture-agent"
path = "src/bin/capture_agent.rs"

[[bin]]
name = "multi-desktop-media-agent"
path = "src/bin/media_agent.rs"

[[bin]]
name = "multidesktopctl"
path = "src/bin/client.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2"
